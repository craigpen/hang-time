<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Steam game controller icon in black -->
  <rect width="64" height="64" fill="#000" rx="8"/>
  <g fill="#FFF">
    <!-- Left stick -->
    <circle cx="20" cy="24" r="5"/>
    <!-- Right sticks -->
    <circle cx="44" cy="32" r="5"/>
    <!-- Buttons on right -->
    <circle cx="44" cy="20" r="3"/>
    <circle cx="52" cy="24" r="3"/>
    <circle cx="52" cy="32" r="3"/>
    <circle cx="44" cy="36" r="3"/>
    <!-- D-pad on left -->
    <rect x="16" y="38" width="2" height="6" rx="1"/>
    <rect x="14" y="40" width="6" height="2" rx="1"/>
  </g>
</svg>
